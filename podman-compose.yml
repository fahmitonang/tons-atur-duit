services:
  app:
    image: tons-budget-tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: tons-budget-tracker
    restart: always
    network_mode: host
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/mariadb:10.11
    container_name: mariadb-catkeu
    restart: always
    command: --port=3307
    network_mode: host
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -P 3307 -u root -p$$MARIADB_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb_data:
