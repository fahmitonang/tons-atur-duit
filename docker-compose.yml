services:
  app:
    image: aturduit:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aturduit-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Jakarta
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aturduit-network

  db:
    image: docker.io/mariadb:10.11
    container_name: mariadb-aturduit
    restart: always
    environment:
      - TZ=Asia/Jakarta
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - aturduit-network
    healthcheck:
      test: "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb_data:

networks:
  aturduit-network:
    driver: bridge
