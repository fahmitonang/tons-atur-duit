services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tons-budget-tracker
    restart: always
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - DATABASE_URL
      - NEXTAUTH_SECRET
      - NEXTAUTH_URL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finance-network

  db:
    image: docker.io/mariadb:10.11
    container_name: mariadb-catkeu
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - MARIADB_ROOT_PASSWORD
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - finance-network
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb_data:

networks:
  finance-network:
    driver: bridge
